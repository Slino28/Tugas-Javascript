<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid brown;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: blanchedalmond;
        }
        tfoot tr {
            background-color: whitesmoke;
            font-weight: bold;
        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Data Gaji Pegawai</h2>

    <script>
        //Diketahui
        let namaPegawai = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "Manajer";
        let status = "Menikah";

        //Menentukan Gaji Pokok menggunakan Struktur 'if / else if / else'
        let gapok = 0;
        if (jabatan.toLowerCase() === "manajer") {
            gapok = 15000000;
        } else if (jabatan.toLowerCase() === "asisten manajer") {
            gapok = 10000000;
        } else if (jabatan.toLowerCase() === "staff") {
            gapok = 5000000;
        } else {
            gapok = 0;
        }

        let tunjJabatan = 0.15 * gapok;
        let bpjs = 0.10 * gapok;
        let tunjKeluarga = (status.toLowerCase() === "menikah") ? (0.20 * gapok) : 0;
        let totalGaji = gapok + tunjJabatan + bpjs + tunjKeluarga;

        function formatRupiah(angka) {
            return "Rp " + angka.toLocaleString("id-ID");
        }

        //Crtak
        document.write(`
            <table>
                <thead>
                    <tr>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Gaji Pokok</th>
                        <th>Tunjangan Jabatan (15%)</th>
                        <th>BPJS (10%)</th>
                        <th>Tunjangan Keluarga (20%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${namaPegawai}</td>
                        <td>${umur} tahun</td>
                        <td>${jabatan}</td>
                        <td>${status}</td>
                        <td>${formatRupiah(gapok)}</td>
                        <td>${formatRupiah(tunjJabatan)}</td>
                        <td>${formatRupiah(bpjs)}</td>
                        <td>${formatRupiah(tunjKeluarga)}</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="7" style="text-align: right;">Total Gaji:</td>
                        <td>${formatRupiah(totalGaji)}</td>
                    </tr>
                </tfoot>
            </table>
        `);
    </script>

</body>
</html>
